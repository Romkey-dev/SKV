stages: [lint, test, build, security, deploy]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  APP_VERSION: "1.0.1"

default:
  image: python:3.11-slim

syntax:
  stage: lint
  script:
    - python -m py_compile app.py test_app.py

markdown:
  stage: lint
  image: node:22
  script:
    - npx --yes markdownlint-cli README.md

tests:
  stage: test
  script:
    - python -m pip install coverage
    - python -m coverage run -m unittest -v
    - python -m coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build:
  stage: build
  script:
    - mkdir -p dist
    - tar -czf "dist/app-${APP_VERSION}.tar.gz" app.py
  artifacts:
    paths: [dist/]

dependency_audit:
  stage: security
  script:
    - python -m pip install pip-audit
    - python -m pip_audit -r requirements.txt

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build, syntax, markdown, tests, dependency_audit]
  script:
    - apk add --no-cache git
    - tar -tzf "dist/app-${APP_VERSION}.tar.gz"
    - test -n "$RELEASE_TOKEN"
    - git tag "v${APP_VERSION}" "$CI_COMMIT_SHA"
    - git push "https://oauth2:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "refs/tags/v${APP_VERSION}"
  artifacts:
    paths: [dist/]
  environment:
    name: training-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
